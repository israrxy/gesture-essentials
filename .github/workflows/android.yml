name: Build Debug APK

# Manual only. One build per test round; nothing fires on push.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "What should be tested in this build?"
        required: false
        default: ""

concurrency:
  group: debug-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caches wrapper, dependencies and build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Verify the 500-line rule
        run: ./scripts/check-size.sh

      - name: Test rules and gestures, then assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --build-cache --configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-essentials-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesture-essentials-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Build ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| APK size | $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1) |"
            echo "| Note | ${{ inputs.note }} |"
            echo ""
            echo "Install with: \`./scripts/install.sh $GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
